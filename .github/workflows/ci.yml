name: macOS checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Offline checks (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version
      - name: Run offline checks
        run: bash scripts/check.sh
      - name: Build app bundle
        if: matrix.runner == 'macos-15-intel'
        run: bash scripts/build-app.sh
      - name: Build universal disk image
        if: matrix.runner == 'macos-15'
        run: |
          bash scripts/package-release.sh
          cd dist
          shasum -a 256 -c MarketBar.dmg.sha256
